# Moleculab package metadata and tool configuration.
# CPU-only by default. ROCm PyTorch is an explicit optional extra.

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "moleculab"
version = "0.1.0"
description = "An educational molecular physics and simulation library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
]

[project.optional-dependencies]
# Example and documentation dependencies: plotting, animations, chemical
# perception, and experimental-structure parsing.
examples = [
    "matplotlib>=3.11",
    "pillow>=13",
    "rdkit>=2026.9",
    "gemmi>=0.7",
]
# PyTorch 2.14.x from the ROCm 7.2 index pairs with triton-rocm 3.8.x.
rocm = [
    "torch>=2.14",
    "triton-rocm>=3.8,<3.9",
]

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.setuptools.packages.find]
where = ["src"]

# Resolve the optional PyTorch packages only from AMD's ROCm 7.2 wheel index.
[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
